services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    depends_on:
      db:
        condition: service_healthy
      # service_started, not service_healthy: a dead or slow engine must never
      # keep the game server from starting.
      engine:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${PORT}
      JWT_SECRET: ${JWT_SECRET}
      ENGINE_URL: ${ENGINE_URL}

    ports:
      - "${PORT}:${PORT}"

  engine:
    build: ./engine
    environment:
      # Which UCI binary the facade runs. Swapping Stockfish for the custom
      # engine is this one line -> /app/engine/chesswhisper_engine
      ENGINE_BINARY_PATH: /app/engine/chesswhisper_engine

      # ENGINE_WORKER_COUNT is deliberately unset: pool.js then runs one
      # engine process per core (under Docker Desktop, the cores given to its
      # VM). Set it here to override, e.g. ENGINE_WORKER_COUNT: 1.

volumes:
  db-data: